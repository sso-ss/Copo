<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoPo — Dashboard</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="./copo-icon.svg"
    />

    <!-- Pretendard is self-hosted in ./vendor/fonts/ for offline use. -->

    <!-- Tailwind + Lucide are CLASSIC global <script>s, not module imports —
         the bundled entry references window.lucide / window.tailwind as
         ambient globals. build-ui.ts copies this HTML + vendor/ verbatim (it
         bundles only the module entry), so these stay untouched classic tags
         and the ./vendor/ paths resolve next to the served HTML. -->
    <script src="./vendor/tailwind.min.js"></script>
    <script src="./vendor/lucide.min.js"></script>

    <link rel="stylesheet" href="./style.css" />
    <!-- The dashboard app: bundled by build-ui.ts from
         shell/src/dashboard/main.ts (which imports the shared i18n runtime +
         DOM binder) into ./main.js, next to this copied-verbatim HTML. -->
    <script type="module" src="./main.js"></script>
  </head>
  <body class="antialiased">
    <div id="app" class="dashboard">
      <div class="dashboard-content">
        <!-- Native macOS titlebar already reads "CoPo — Dashboard";
             no in-window duplicate. Content starts at the control row. -->

        <!-- Period selector. Data refreshes automatically — Tauri
             webviews subscribe to a Channel<TokenUsageEvent> driven by
             the shell; plain-browser viewers poll on a timer. No
             Fetch button. The language picker is a global, section-
             agnostic control (same maximal.locale override as Settings,
             shared :4141 origin); options + selection are wired in
             main.ts (wireLocalePicker), which re-runs applyI18n live. -->
        <div class="dashboard-toolbar">
          <span
            id="token-usage-period-label"
            class="control-label"
            data-i18n="dashboard-period-label"
            >Period</span
          >
          <div
            id="token-usage-period"
            class="segmented"
            role="group"
            aria-labelledby="token-usage-period-label"
          >
            <button
              type="button"
              class="segmented-option"
              data-period="day"
              aria-pressed="true"
              data-i18n="dashboard-period-days"
              data-i18n-count="1"
            >1 day</button>
            <button
              type="button"
              class="segmented-option"
              data-period="week"
              aria-pressed="false"
              data-i18n="dashboard-period-days"
              data-i18n-count="7"
            >7 days</button>
            <button
              type="button"
              class="segmented-option"
              data-period="month"
              aria-pressed="false"
              data-i18n="dashboard-period-days"
              data-i18n-count="30"
            >30 days</button>
          </div>
          <div class="lang-picker">
            <label
              class="control-label"
              for="locale-select"
              data-i18n="common-language-label"
            ></label>
            <select
              class="language-select"
              id="locale-select"
              data-locale-select
            ></select>
          </div>
        </div>

        <!-- Content area for dynamically rendered data. -->
        <main id="content-area"></main>
      </div>
    </div>
  </body>
</html>
