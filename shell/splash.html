<!doctype html>
<!--
  Pre-boot splash. Shown the instant the tray app launches, before the
  sidecar proxy is reachable — immediate, visible feedback that an
  otherwise menu-bar-only app started.

  Local recovery shell. CoPo artwork and CSS remain available before the
  gateway starts. The logo asset is bundled by scripts/build-ui.ts.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CoPo</title>
    <style>
@font-face {
  font-family: "Pretendard Variable";
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
  src: url("./ui/settings/vendor/fonts/pretendard-variable.woff2") format("woff2");
}
      :root {
        --font-body: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --brand: #161616;     /* themes.dark.surfaceCard, CoPo logo background */
        --cream: #f5f5f5;     /* themes.dark.textStrong */
      }
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        user-select: none;
        cursor: default;
        overflow: hidden;
      }
      .splash {
        box-sizing: border-box;
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        /* Optically-weighted frame: a touch more bottom than top so the
           heavy wordmark sits visually centered, generous side margins. */
        padding: 34px 44px 40px;
        background: var(--brand);
        border-radius: 14px;
        text-align: center;
        opacity: 1;
        transition: opacity 200ms ease-out;
      }
      .splash.is-leaving { opacity: 0; }

      /* CoPo cheese mark and system-font name, available before gateway boot. */
      .wordmark {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font: 700 48px/1 var(--font-body);
        width: 100%;
        max-width: 340px;
        height: auto;
        color: var(--cream);
      }

      .wordmark img { width: 80px; height: 80px; }

      .status {
        font-family: var(--font-body);
        /* Standard App ramp --text-base: 16px / --weight-base 400 /
           --leading-base 1.6 (mirrors tokens.css). */
        font-weight: 400;
        font-size: 16px;
        line-height: 1.6;
        color: var(--cream);
        opacity: 0.82;
        min-height: 1.6em;
        transition: opacity 150ms ease-out;
      }

      /* Failure state: the status line carries the reason, with a quieter
         hint below pointing at the menu-bar recovery actions. The brand
         surface stays — this is "couldn't start," not a system error dialog. */
      .hint {
        font-family: var(--font-body);
        font-size: 13px;
        line-height: 1.5;
        color: var(--cream);
        opacity: 0;
        max-width: 320px;
        min-height: 1.5em;
        transition: opacity 150ms ease-out;
      }
      .splash.is-error .status {
        opacity: 1;
        font-weight: 500;
      }
      .splash.is-error .hint {
        opacity: 0.72;
      }

      /* Quiet build-version stamp, pinned to the bottom edge so it never
         nudges the optically-centered wordmark. Populated by the script
         below from window.__MAXIMAL_VERSION__ (injected by lib.rs before
         first paint); stays empty in dev where the version is a placeholder.
         Kept visible in the error state too — it's useful in a bug report. */
      .version {
        position: absolute;
        bottom: 12px;
        left: 0;
        right: 0;
        font-family: var(--font-body);
        font-size: 11px;
        line-height: 1.4;
        letter-spacing: 0.02em;
        color: var(--cream);
        opacity: 0.5;
        text-align: center;
      }

      @media (prefers-reduced-motion: reduce) {
        .splash,
        .status,
        .hint {
          transition: opacity 60ms linear;
        }
      }
    </style>
  </head>
  <body>
    <main class="splash" role="status" aria-live="polite">
      <div class="wordmark"><img src="assets/copo-icon.svg" alt=""><span>CoPo</span></div>
      <div class="status" id="status">Starting the proxy…</div>
      <div class="hint" id="hint"></div>
      <div class="version" id="version"></div>
    </main>
    <script>
      (function () {
        var splash = document.querySelector(".splash");
        var status = document.getElementById("status");
        var hint = document.getElementById("hint");

        // Stamp the build version (lib.rs injects it before first paint).
        // Skip the dev "0.0.0" placeholder so it only ever shows a real tag.
        var version = document.getElementById("version");
        var v = window.__MAXIMAL_VERSION__;
        if (version && v && v !== "0.0.0") version.textContent = "v" + v;

        var t = window.__TAURI__;
        if (!t || !t.event || typeof t.event.listen !== "function") return;

        // Live boot status relayed from the sidecar (emitBootStatus in
        // src/start.ts -> the shell's stdout relay). Keeps the splash honest
        // about a slow start instead of a frozen "Starting the proxy...".
        t.event.listen("splash:status", function (e) {
          if (splash.classList.contains("is-error")) return;
          if (e && e.payload) status.textContent = String(e.payload);
        });

        // The sidecar failed to start. Show WHY (the captured reason) and
        // point at the menu-bar recovery actions, instead of fading blank.
        // Rust holds the splash open in this state.
        t.event.listen("splash:error", function (e) {
          splash.classList.remove("is-leaving");
          splash.classList.add("is-error");
          status.textContent =
            (e && e.payload && String(e.payload)) ||
            "The proxy could not start.";
          hint.textContent =
            "Click the CoPo menu-bar icon to retry startup or view the logs.";
        });

        // Rust owns dismissal (sidecar healthy, or any window opening) and
        // emits "splash:leave" to start the fade, then closes the window.
        // The page only reacts so the fade and close stay in lockstep.
        t.event.listen("splash:leave", function () {
          splash.classList.add("is-leaving");
        });
      })();
    </script>
  </body>
</html>
